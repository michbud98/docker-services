services:
  registry:
    image: registry:3
    container_name: registry
    restart: unless-stopped
    # host_port:container_port/protocol
    ports:
      - 5000:5000
    volumes:
      - registry_data:/var/lib/registry

networks:
  default:
    driver: bridge
    ipam:
      driver: default
    name: Registry

volumes:
  registry_data:

